name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      options:
        - label: Works for self-hosters without any hosted service
        - label: Keeps the archive in open formats and exportable
        - label: Does not weaken third-party protection or safe defaults
